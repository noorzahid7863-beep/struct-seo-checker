<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO & Link Health Checker Dashboard</title>
    <!-- Bootstrap CSS for styling and badges -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <h2 class="mb-4">📊 SEO & Link Health Checker Dashboard</h2>
        
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>URL</th>
                                <th>Status</th>
                                <th>Response Time</th>
                                <th>SEO Score & Issues</th>
                                <th>Issues List & Fix Guidance</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data will be loaded dynamically here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Embedded script to load report.json correctly without [object Object] errors -->
    <script>
        async function loadReport() {
            try {
                const response = await fetch('../report.json');
                const data = await response.json();
                
                const tableBody = document.querySelector('tbody');
                if (!tableBody) return;
                tableBody.innerHTML = '';

                data.forEach(item => {
                    const row = document.createElement('tr');

                    // Issues formatting with Severity badges, Why, and Fix
                    let issuesHtml = '';
                    if (item.issues && item.issues.length > 0) {
                        issuesHtml = item.issues.map(iss => {
                            let badgeClass = 'bg-danger';
                            if (iss.severity === 'Warning') badgeClass = 'bg-warning text-dark';
                            if (iss.severity === 'Info') badgeClass = 'bg-info text-dark';

                            return `
                                <div style="margin-bottom: 8px; border-bottom: 1px solid #ddd; padding-bottom: 4px;">
                                    <span class="badge ${badgeClass}">${iss.severity || 'Issue'}</span> 
                                    <strong>${iss.type}</strong><br>
                                    <small><b>Why:</b> ${iss.why}</small><br>
                                    <small><b>Fix:</b> ${iss.fix}</small>
                                </div>
                            `;
                        }).join('');
                    } else {
                        issuesHtml = '<span style="color: green;">✅ No Issues Found</span>';
                    }

                    row.innerHTML = `
                        <td><a href="${item.url}" target="_blank">${item.url}</a></td>
                        <td><span class="badge bg-success">${item.statusCode || 200}</span></td>
                        <td>${item.responseTime || 0} ms</td>
                        <td><b>Score: ${item.score !== undefined ? item.score : 100}/100</b><br><small>${item.issuesCount || 0} issues found</small></td>
                        <td>${issuesHtml}</td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (err) {
                console.error('Error loading report:', err);
            }
        }

        loadReport();
    </script>
</body>
</html>
