<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SEO & Link Health Checker Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f9; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .input-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 12px 24px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:disabled { background: #888; }
        #status { font-weight: bold; margin-bottom: 15px; color: #555; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #007bff; color: white; }
        .badge { padding: 4px 8px; border-radius: 4px; color: white; font-size: 12px; }
        .critical { background: #dc3545; }
        .warning { background: #ffc107; color: black; }
        .info { background: #17a2b8; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 SEO & Link Health Checker</h2>
    
    <div class="input-box">
        <input type="text" id="urlInput" placeholder="Enter website URL (e.g., https://crawler-test.com)" />
        <button id="scanBtn" onclick="startScan()">Check Health</button>
    </div>

    <div id="status"></div>

    <table id="resultsTable" style="display:none;">
        <thead>
            <tr>
                <th>URL</th>
                <th>Status</th>
                <th>Score</th>
                <th>Response Time</th>
                <th>Issues</th>
            </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
    </table>
</div>

<script>
async function startScan() {
    const urlInput = document.getElementById('urlInput').value.trim();
    const statusDiv = document.getElementById('status');
    const scanBtn = document.getElementById('scanBtn');
    const resultsTable = document.getElementById('resultsTable');
    const resultsBody = document.getElementById('resultsBody');

    if (!urlInput) {
        alert('Please enter a valid URL!');
        return;
    }

    scanBtn.disabled = true;
    statusDiv.innerHTML = '⏳ Scanning... Please wait...';
    resultsBody.innerHTML = '';
    resultsTable.style.display = 'none';

    try {
        const response = await fetch('/api/scan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: urlInput })
        });

        const data = await response.json();

        if (data.success && data.results) {
            statusDiv.innerHTML = `✅ Scan completed! Total pages checked: ${data.results.length}`;
            resultsTable.style.display = 'table';

            data.results.forEach(res => {
                let issuesHtml = res.issues.map(i => 
                    `<span class="badge ${i.severity.toLowerCase()}">${i.type}</span>`
                ).join(' ');

                let row = `<tr>
                    <td><a href="${res.url}" target="_blank">${res.url}</a></td>
                    <td>${res.statusCode}</td>
                    <td><b>${res.score}/100</b></td>
                    <td>${res.responseTime}</td>
                    <td>${issuesHtml || 'None'}</td>
                </tr>`;
                resultsBody.innerHTML += row;
            });
        } else {
            statusDiv.innerHTML = '❌ Scan failed.';
        }
    } catch (err) {
        statusDiv.innerHTML = '❌ Error connecting to server.';
    } finally {
        scanBtn.disabled = false;
    }
}
</script>

</body>
</html>
