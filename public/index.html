<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO & Link Health Checker Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; color: #333; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="url"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:disabled { background: #888; }
        #status { font-weight: bold; margin-bottom: 15px; color: #555; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
        .badge { padding: 4px 8px; border-radius: 4px; color: white; font-size: 12px; font-weight: bold; display: inline-block; margin: 2px; }
        .badge-critical { background-color: #dc3545; }
        .badge-warning { background-color: #ffc107; color: black; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 SEO & Link Health Checker</h1>
    <div class="search-box">
        <input type="url" id="urlInput" placeholder="Enter Website URL (e.g., https://crawler-test.com)" required>
        <button id="scanBtn" onclick="startScan()">Check Health</button>
    </div>

    <div id="status"></div>

    <table id="resultsTable" style="display:none;">
        <thead>
            <tr>
                <th>URL</th>
                <th>Status</th>
                <th>Score</th>
                <th>Response Time</th>
                <th>Issues</th>
            </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
    </table>
</div>

<script>
async function startScan() {
    const urlInput = document.getElementById('urlInput').value.trim();
    const scanBtn = document.getElementById('scanBtn');
    const statusDiv = document.getElementById('status');
    const table = document.getElementById('resultsTable');
    const tbody = document.getElementById('resultsBody');

    if (!urlInput) {
        alert("Please enter a valid URL!");
        return;
    }

    // UI Updates during scanning
    scanBtn.disabled = true;
    statusDiv.innerHTML = "⏳ <strong>Scanning...</strong> Please wait.";
    table.style.display = "none";
    tbody.innerHTML = "";

    try {
        const response = await fetch('/api/scan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: urlInput })
        });

        const result = await response.json();

        if (result.success) {
            statusDiv.innerHTML = `✅ <strong>Scan completed!</strong> Total pages checked: ${result.totalChecked}`;
            
            result.data.forEach(item => {
                let issuesHtml = item.issues.map(iss => 
                    `<span class="badge ${iss.severity === 'Critical' ? 'badge-critical' : 'badge-warning'}">${iss.type}</span>`
                ).join(' ') || '<span style="color:green;">No Issues</span>';

                const row = `
                    <tr>
                        <td><a href="${item.url}" target="_blank">${item.url}</a></td>
                        <td>${item.statusCode}</td>
                        <td><strong>${item.score}/100</strong></td>
                        <td>${item.responseTime} ms</td>
                        <td>${issuesHtml}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

            table.style.display = "table";
        } else {
            statusDiv.innerHTML = "❌ " + (result.error || "Scan failed.");
        }
    } catch (error) {
        statusDiv.innerHTML = "❌ Server error. Please check backend connection.";
    } finally {
        scanBtn.disabled = false;
    }
}
</script>

</body>
</html>
